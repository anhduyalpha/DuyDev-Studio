<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="mobiusBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="mobiusBlue2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="mobiusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>
    <filter id="glowMobius" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#mobiusBg)" stroke="rgba(56,189,248,0.25)" stroke-width="1.5" />

  <!-- Left Loop of Infinity / D -->
  <path d="M 40 38 C 24 38 18 50 18 60 C 18 70 24 82 40 82 C 54 82 60 68 60 60 C 60 52 54 38 40 38 Z" 
        stroke="url(#mobiusBlue1)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Loop of Infinity / D -->
  <path d="M 80 38 C 96 38 102 50 102 60 C 102 70 96 82 80 82 C 66 82 60 68 60 60 C 60 52 66 38 80 38 Z" 
        stroke="url(#mobiusBlue2)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Overlapping Cross Ribbon Highlight -->
  <path d="M 46 44 C 54 52 66 68 74 76" 
        stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="url(#glowMobius)" opacity="0.95" />
        
  <!-- Glowing Orbital Core Pips -->
  <circle cx="34" cy="60" r="3.5" fill="#38BDF8" filter="url(#glowMobius)" />
  <circle cx="86" cy="60" r="3.5" fill="#60A5FA" filter="url(#glowMobius)" />
</svg>
