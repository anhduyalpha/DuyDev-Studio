<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="deltaInter4c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5400" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>
    <filter id="glowInter4c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#0C0A09" stroke="rgba(255,84,0,0.25)" stroke-width="1.5" />
  
  <!-- Outer Leading Delta Wing (First D) -->
  <path d="M 30 26 L 66 26 C 86 26 98 42 98 60 C 98 78 86 94 66 94 L 30 94 L 46 60 Z" 
        stroke="url(#deltaInter4c)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inner Interlocking Trailing Delta (Second D) -->
  <path d="M 48 40 L 68 40 C 78 40 84 48 84 60 C 84 72 78 80 68 80 L 48 80 L 58 60 Z" 
        stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowInter4c)" />

  <!-- Aerodynamic Center Needle -->
  <polygon points="62,60 72,54 70,60 72,66" fill="#FF5400" />
  
  <!-- Subtle Mach Speed Ring -->
  <circle cx="64" cy="60" r="44" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3 6" />
</svg>
