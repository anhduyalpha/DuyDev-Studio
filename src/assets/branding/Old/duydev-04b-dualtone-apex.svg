<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="cyanWing4b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="amberWing4b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB8500" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>
    <filter id="glowDual4b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#0A0B10" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Upper Cyan Wing Half (Top curve of D) -->
  <path d="M 36 28 L 68 28 C 88 28 98 42 100 58 L 54 58 Z" 
        fill="url(#cyanWing4b)" filter="url(#glowDual4b)" />
        
  <!-- Lower Amber Wing Half (Bottom curve of D) -->
  <path d="M 36 92 L 68 92 C 88 92 98 78 100 62 L 54 62 Z" 
        fill="url(#amberWing4b)" filter="url(#glowDual4b)" />

  <!-- Central Kinetic Negative Jet Notch (The cut that defines the D shape) -->
  <polygon points="36,28 54,60 36,92 28,60" fill="#0A0B10" />

  <!-- Dual Trailing Velocity Lines -->
  <line x1="16" y1="42" x2="28" y2="42" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
  <line x1="16" y1="78" x2="28" y2="78" stroke="#FB8500" stroke-width="3" stroke-linecap="round" />
  
  <!-- Razor Sharp Apex Join Pip -->
  <circle cx="100" cy="60" r="2.5" fill="#FFFFFF" />
</svg>
