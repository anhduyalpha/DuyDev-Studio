<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>DuyDev Studio - Utility Hub</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#F4F4F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DuyDev Studio">
  <meta name="description" content="Personal Utility Hub & File Processing Suite">

  <!-- Immediate Theme Initialization (Default Light Mode with Zero-Flash Restoration) -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('ds_theme');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#09090B');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (_) {}
    })();
  </script>
  
  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="src/assets/logo-ds.svg">
  <link rel="apple-touch-icon" href="src/assets/icon-192.png">

  <!-- Share Target Module Preloads (Parallel network download during head parse) -->
  <link rel="modulepreload" href="./src/utilities/shareTargetHelper.js">
  <link rel="modulepreload" href="./src/components/common/ShareTargetModal.js">
  <link rel="modulepreload" href="./src/utilities/formatters.js">

  <!-- Frame-0 Share Target Instant Detection & Startup Loader Suppression -->
  <script>
    (function() {
      var h = window.location.hash || '';
      var s = window.location.search || '';
      if (h.includes('share-target') || s.includes('hasFiles=1') || s.includes('url=') || s.includes('text=')) {
        document.documentElement.classList.add('is-share-target');
        window.__FAST_PATH_SHARE_ACTIVE = true;
      }
    })();
  </script>
  <style>
    /* Instant suppression: Never show startup loader when opening via Share Sheet */
    .is-share-target #appStartupLoader {
      display: none !important;
    }
    /* Instant display: Show fast-path share placeholder on frame 1 */
    #fastPathSharePlaceholder {
      display: none;
    }
    .is-share-target #fastPathSharePlaceholder {
      display: flex !important;
    }
  </style>
  
  <!-- Google Fonts: Plus Jakarta Sans (Primary UI), Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],

            },

              shimmer: 'shimmer 1.8s infinite',

    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stitch Design Tokens & Custom CSS -->
  <link rel="stylesheet" href="src/styles/stitch-tokens.css?v=22.7">
  <link rel="stylesheet" href="src/styles/studocu.css?v=22.7">
  <link rel="stylesheet" href="src/styles/highlight-theme.css?v=22.7">

  <!-- Share Target Fast-Path Critical CSS (Instant styling before Tailwind compilation) -->
  <style>
    #globalShareTargetContainer {
      position: relative;
      z-index: 9998;
    }
    #shareTargetBackdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #shareTargetPanel {
      background-color: #111114;
      border-color: #27272a;

    }
    .share-action-card[aria-selected="true"] {
      border-color: rgba(99, 102, 241, 0.8);
      background-color: rgba(99, 102, 241, 0.15);
    }
  </style>

  <!-- Autonomous Cache Recovery & Script Error Boundary -->
  <script>

    // 2. Full deep reset function
    window.emergencyResetApp = async function() {
      try {
        localStorage.clear();
        sessionStorage.clear();
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function(k) { return caches.delete(k); }));
        }
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function(r) { return r.unregister(); }));
        }
      } catch (err) {
        console.warn('Reset error:', err);
      }
      window.location.replace(window.location.origin + window.location.pathname + '?clear=' + Date.now());
    };

    // 3. Autonomous Self-Healing Error Boundary
    window.addEventListener('error', function(e) {
      if (e.target && e.target !== window) return;
      console.error('[Global Error]', e.error || e.message);
      var app = document.getElementById('app');
      if (app && !app.querySelector('main')) {
        // Persistent failure UI with manual action button instead of auto-reloading loop
        app.innerHTML = '<div class="min-h-screen flex items-center justify-center p-4 bg-zinc-950 text-white font-mono">' +
          '<div class="max-w-md w-full p-6 rounded-2xl bg-zinc-900 border border-red-500/30 text-center space-y-4 shadow-xl">' +
          '<h2 class="text-red-400 font-bold text-base">Khởi động giao diện thất bại</h2>' +
          '<p class="text-xs text-zinc-400 leading-relaxed break-all">' + (e.message || 'Lỗi khi tải tập lệnh ứng dụng.') + '</p>' +
          '<div class="pt-2 flex justify-center gap-2">' +
          '<button onclick="emergencyResetApp()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold cursor-pointer shadow-md transition">Xóa sạch bộ nhớ đệm & Tải lại</button>' +
          '</div></div></div>';
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[Unhandled Rejection]', e.reason);
      var app = document.getElementById('app');
      if (app && !app.querySelector('main')) {
        var reason = (e.reason && e.reason.message) || String(e.reason) || 'Lỗi tải mô-đun ứng dụng';
        app.innerHTML = '<div class="min-h-screen flex items-center justify-center p-4 bg-zinc-950 text-white font-mono">' +
          '<div class="max-w-md w-full p-6 rounded-2xl bg-zinc-900 border border-red-500/30 text-center space-y-4 shadow-xl">' +
          '<h2 class="text-red-400 font-bold text-base">Khởi động giao diện thất bại</h2>' +
          '<p class="text-xs text-zinc-400 leading-relaxed break-all">' + reason + '</p>' +
          '<div class="pt-2 flex justify-center gap-2">' +
          '<button onclick="emergencyResetApp()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold cursor-pointer shadow-md transition">Xóa sạch bộ nhớ đệm & Tải lại</button>' +
          '</div></div></div>';
      }
    });
  </script>
</head>
<body class="bg-[#F4F4F6] dark:bg-[#09090B] text-zinc-900 dark:text-[#FAFAFA] font-sans min-h-screen transition-colors duration-200 overflow-x-hidden w-full max-w-full">
  
  <!-- Fast-Path Instant Share Target Shell (<10ms display) -->
  <div id="fastPathSharePlaceholder" class="fixed inset-0 z-[9999] flex items-end sm:items-center justify-center p-0 sm:p-4" style="position:fixed;inset:0;z-index:9999;align-items:flex-end;justify-content:center;">
    <!-- Backdrop -->
    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:9998;"></div>
    <!-- Panel -->
    <div style="position:relative;z-index:9999;width:100%;max-width:28rem;border-top-left-radius:1.5rem;border-top-right-radius:1.5rem;border:1px solid rgba(63,63,70,0.5);background:#111114;padding:1.25rem;color:#fafafa;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);" class="sm:rounded-3xl">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem;padding-bottom:0.75rem;border-bottom:1px solid rgba(63,63,70,0.4);">
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <div style="width:2.25rem;height:2.25rem;border-radius:0.75rem;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);display:flex;align-items:center;justify-content:center;color:#818cf8;font-weight:bold;font-size:12px;">
            DS
          </div>
          <div>
            <div style="font-size:0.875rem;font-weight:700;color:#f4f4f5;">Chia sẻ vào DuyDev Studio</div>
            <div id="fastShareStatusLabel" style="font-size:11px;color:#a1a1aa;">Đang nạp dữ liệu chia sẻ...</div>
          </div>
        </div>
        <button type="button" onclick="if (window.closeFastSharePlaceholder) { window.closeFastSharePlaceholder(); } else { var p = document.getElementById('fastPathSharePlaceholder'); if (p) p.remove(); window.__FAST_PATH_SHARE_ACTIVE = false; document.documentElement.classList.remove('is-share-target'); history.replaceState(null, '', window.location.pathname); }" style="color:#a1a1aa;padding:0.375rem;border-radius:0.5rem;background:transparent;border:none;cursor:pointer;" title="Đóng">
          ✕
        </button>
      </div>
      <div id="fastSharePreviewCard" style="margin-top:1rem;padding:0.875rem;border-radius:1rem;background:rgba(39,39,42,0.5);border:1px solid rgba(63,63,70,0.5);">
        <div style="display:flex;align-items:center;gap:0.625rem;">
          <div style="width:1.25rem;height:1.25rem;border-radius:50%;border:2px solid #6366f1;border-top-color:transparent;animation:spin 0.8s linear infinite;" class="animate-spin"></div>
          <span id="fastSharePreviewText" style="font-size:12px;color:#d4d4d8;">Đang đọc tệp và chuẩn bị module...</span>
        </div>
      </div>
      <div style="margin-top:1rem;display:flex;flex-direction:column;gap:0.5rem;" id="fastShareActionSkeletons">
        <div style="height:2.75rem;border-radius:0.75rem;background:rgba(39,39,42,0.4);border:1px solid rgba(63,63,70,0.3);animation:pulse 1.5s infinite;" class="animate-pulse"></div>
        <div style="height:2.75rem;border-radius:0.75rem;background:rgba(39,39,42,0.3);border:1px solid rgba(63,63,70,0.2);animation:pulse 1.5s infinite;" class="animate-pulse"></div>
      </div>
    </div>
  </div>

  <!-- Synchronously inspect URL search & hash params to populate fastSharePreviewText in 0ms -->
  <script>
    (function() {
      if (!window.__FAST_PATH_SHARE_ACTIVE) return;
      try {
        var h = window.location.hash || '';
        var hq = h.includes('?') ? h.split('?')[1] : '';
        var s = window.location.search ? window.location.search.slice(1) : '';
        var combined = [s, hq].filter(Boolean).join('&');
        var sp = new URLSearchParams(combined);
        var url = sp.get('url');
        var text = sp.get('text');
        var title = sp.get('title');
        var hasFiles = sp.get('hasFiles') === '1';
        var previewEl = document.getElementById('fastSharePreviewText');
        var statusEl = document.getElementById('fastShareStatusLabel');
        if (hasFiles && previewEl) {
          previewEl.textContent = 'Đang đọc tệp từ thiết bị và chuẩn bị module...';
          if (statusEl) statusEl.textContent = 'Đã nhận tệp chia sẻ';
        } else if (url && previewEl) {
          previewEl.textContent = 'Liên kết: ' + (url.length > 45 ? url.slice(0, 45) + '…' : url);
          if (statusEl) statusEl.textContent = 'Đã nhận liên kết chia sẻ';
        } else if (text && previewEl) {
          previewEl.textContent = 'Nội dung: ' + (text.length > 45 ? text.slice(0, 45) + '…' : text);
          if (statusEl) statusEl.textContent = 'Đã nhận nội dung chia sẻ';
        }
      } catch (e) {}
    })();
  </script>

  <!-- Global Share Target Modal Container (Mounted at body root to decouple from SPA router DOM updates) -->
  <div id="globalShareTargetContainer"></div>

  <!-- Fast-Path Instant Overlay for Web Share Target (<150ms immediate display) -->
  <script type="module">
    import { pollPendingSharedData } from './src/utilities/shareTargetHelper.js';
    import { openShareTargetModal } from './src/components/common/ShareTargetModal.js';

    const hash = window.location.hash || '';
    const search = window.location.search || '';
    const hasNativeShared = typeof window.AndroidBridge !== 'undefined' &&
      typeof window.AndroidBridge.getSharedPayload === 'function' &&
      Boolean(window.AndroidBridge.getSharedPayload());
    const isShare = hash.startsWith('#share-target') || search.includes('hasFiles=1') || search.includes('url=') || search.includes('text=') || hasNativeShared;

    function closeFastSharePlaceholder() {
      const p = document.getElementById('fastPathSharePlaceholder');
      if (p) p.remove();
      window.__FAST_PATH_SHARE_ACTIVE = false;
      document.documentElement.classList.remove('is-share-target');
      if (window.location.hash.startsWith('#share-target') || window.location.search.includes('hasFiles=1')) {
        history.replaceState(null, '', window.location.pathname);
      }
    }
    window.closeFastSharePlaceholder = closeFastSharePlaceholder;

    async function attemptFastShareLoad() {
      const previewCard = document.getElementById('fastSharePreviewCard');
      const skeletons = document.getElementById('fastShareActionSkeletons');
      const statusLabel = document.getElementById('fastShareStatusLabel');

      if (statusLabel) statusLabel.textContent = 'Đang nạp dữ liệu chia sẻ...';
      if (skeletons) skeletons.style.display = 'flex';
      if (previewCard) {
        previewCard.innerHTML = `
          <div style="display:flex;align-items:center;gap:0.625rem;">
            <div style="width:1.25rem;height:1.25rem;border-radius:50%;border:2px solid #6366f1;border-top-color:transparent;animation:spin 0.8s linear infinite;" class="animate-spin"></div>
            <span id="fastSharePreviewText" style="font-size:12px;color:#d4d4d8;">Đang đọc tệp và chuẩn bị module...</span>
          </div>
        `;
      }

      try {
        let payload = await pollPendingSharedData(4500);

        if (!payload) {
          const h = window.location.hash || '';
          const hq = h.includes('?') ? h.split('?')[1] : '';
          const s = window.location.search ? window.location.search.slice(1) : '';
          const combined = [s, hq].filter(Boolean).join('&');
          const sp = new URLSearchParams(combined);
          const url = sp.get('url') || '';
          const text = sp.get('text') || '';
          const title = sp.get('title') || '';
          if (url || text || title) {
            payload = { url, text, title, files: [] };
          }
        }

        // Avoid duplicate modal if already opened while polling
        if (document.getElementById('shareTargetPanel')) {
          const p = document.getElementById('fastPathSharePlaceholder');
          if (p) p.remove();
          return;
        }

        if (payload) {
          window.__FAST_PATH_SHARE_ACTIVE = true;
          openShareTargetModal(payload);
        } else {
          // Double-check modal was not opened in between
          if (document.getElementById('shareTargetPanel')) {
            const p = document.getElementById('fastPathSharePlaceholder');
            if (p) p.remove();
            return;
          }

          // Timeout recovery UI
          if (statusLabel) statusLabel.textContent = 'Không thể nạp tệp';
          if (skeletons) skeletons.style.display = 'none';
          if (previewCard) {
            previewCard.innerHTML = `
              <div style="display:flex;flex-direction:column;gap:0.75rem;">
                <div style="display:flex;align-items:flex-start;gap:0.625rem;">
                  <span style="color:#f59e0b;font-size:1.125rem;line-height:1;margin-top:0.125rem;">⚠️</span>
                  <span style="font-size:12px;color:#d4d4d8;line-height:1.4;">Không thể nạp tệp chia sẻ từ thiết bị. Tệp có thể đã bị hệ điều hành thu hồi hoặc phiên truyền tải bị ngắt.</span>
                </div>
                <div style="display:flex;gap:0.5rem;justify-content:flex-end;padding-top:0.25rem;">
                  <button type="button" id="fastShareBtnRetry" style="padding:0.375rem 0.75rem;border-radius:0.5rem;background:#4f46e5;color:white;font-size:11px;font-weight:600;border:none;cursor:pointer;">Thử lại</button>
                  <button type="button" id="fastShareBtnClose" style="padding:0.375rem 0.75rem;border-radius:0.5rem;background:rgba(63,63,70,0.5);color:#d4d4d8;font-size:11px;font-weight:500;border:none;cursor:pointer;">Đóng</button>
                </div>
              </div>
            `;
            document.getElementById('fastShareBtnRetry')?.addEventListener('click', () => attemptFastShareLoad());
            document.getElementById('fastShareBtnClose')?.addEventListener('click', closeFastSharePlaceholder);
          }
        }
      } catch (err) {
        console.warn('[FastPath] Direct share target launch warning:', err);
      }
    }

    if (isShare) {
      attemptFastShareLoad();
    }
  </script>

  <!-- Root Mount Point for Modular PWA Architecture -->
  <div id="app" class="w-full max-w-full overflow-x-hidden min-h-screen">
    <!-- Immediate CSS loader to prevent black void during normal script execution (suppressed in share mode) -->
    <div id="appStartupLoader" class="min-h-screen flex items-center justify-center p-4">
      <div class="flex flex-col items-center gap-3 text-zinc-400">
        <div class="w-9 h-9 rounded-xl bg-zinc-200 dark:bg-white/[0.08] border border-zinc-300 dark:border-white/[0.12] flex items-center justify-center font-bold text-xs text-zinc-900 dark:text-white animate-pulse">
          DS
        </div>
        <span class="text-xs font-mono text-zinc-500">Đang khởi động DuyDev Studio...</span>
      </div>
    </div>
  </div>

  <!-- Non-blocking deferred vendor engines -->
  <script src="src/vendor/highlight.min.js" defer></script>
  <script src="src/vendor/thinking-orbs.js" defer></script>
  <script src="src/vendor/qr-code-styling.js" defer onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js';"></script>

  <!-- Main ES Module Bootstrapper -->
  <script type="module" src="src/app.js?v=22.7"></script>
</body>
