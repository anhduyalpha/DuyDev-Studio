<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="monoStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
    <linearGradient id="monoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glowMono" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#monoBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Outer D Path -->
  <path d="M 32 30 H 60 C 76 30 88 42 88 60 C 88 78 76 90 60 90 H 32 Z" 
        stroke="url(#monoStroke)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Inner Interlocking D Path -->
  <path d="M 48 45 H 60 C 68 45 74 51 74 60 C 74 69 68 75 60 75 H 48 Z" 
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Precision 45-degree Alignment Bevel Mark -->
  <line x1="32" y1="30" x2="48" y2="45" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  <line x1="32" y1="90" x2="48" y2="75" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Micro Center Node -->
  <circle cx="60" cy="60" r="3" fill="#FFFFFF" filter="url(#glowMono)" />
</svg>
