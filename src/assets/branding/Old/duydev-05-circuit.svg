<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="traceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="circuitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <filter id="glowCircuit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#circuitBg)" stroke="rgba(245,158,11,0.25)" stroke-width="1.5" />
  
  <!-- Outer Circuit Trace forming D -->
  <path d="M 34 32 H 60 C 78 32 90 44 90 60 C 90 76 78 88 60 88 H 34 V 32" 
        stroke="url(#traceGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Parallel Inner Trace Bus -->
  <path d="M 46 44 H 58 C 68 44 76 51 76 60 C 76 69 68 76 58 76 H 46 V 44" 
        stroke="url(#traceGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Solder Pad Nodes & Integrated Traces -->
  <!-- Node Top -->
  <circle cx="22" cy="32" r="4.5" fill="#0A0E17" stroke="#FCD34D" stroke-width="2.5" />
  <circle cx="22" cy="32" r="2" fill="#FCD34D" />
  <line x1="26.5" y1="32" x2="34" y2="32" stroke="#FCD34D" stroke-width="3" />

  <!-- Node Middle -->
  <circle cx="22" cy="60" r="4.5" fill="#0A0E17" stroke="#10B981" stroke-width="2.5" />
  <circle cx="22" cy="60" r="2" fill="#10B981" filter="url(#glowCircuit)" />
  <line x1="26.5" y1="60" x2="46" y2="60" stroke="#10B981" stroke-width="3" />

  <!-- Node Bottom -->
  <circle cx="22" cy="88" r="4.5" fill="#0A0E17" stroke="#FCD34D" stroke-width="2.5" />
  <circle cx="22" cy="88" r="2" fill="#FCD34D" />
  <line x1="26.5" y1="88" x2="34" y2="88" stroke="#FCD34D" stroke-width="3" />

  <!-- Right Arc Output Probes -->
  <circle cx="98" cy="46" r="3" fill="#10B981" filter="url(#glowCircuit)" />
  <line x1="86" y1="46" x2="95" y2="46" stroke="#10B981" stroke-width="2.5" />
  <circle cx="98" cy="74" r="3" fill="#F59E0B" />
  <line x1="86" y1="74" x2="95" y2="74" stroke="#F59E0B" stroke-width="2.5" />
</svg>
