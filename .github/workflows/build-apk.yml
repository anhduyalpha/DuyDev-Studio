name: Build Android APK & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" dist/duydev-studio.apk
          ls -lh dist/duydev-studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duydev-studio-apk
          path: dist/duydev-studio.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: DuyDev Studio Native APK ${{ github.ref_name }}
          files: dist/duydev-studio.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DuyDev Studio Native Android Wrapper (${{ github.ref_name }})

            ### Điểm nổi bật phiên bản ${{ github.ref_name }}:
            - **Converter Pro Progressive Disclosure & Mobile Ergonomics**: Tái cấu trúc giao diện theo giai đoạn xử lý, vùng thả tệp Stitch Dropzone tự động thu gọn thành thanh tác vụ nhỏ gọn, kích thước nút bấm tối thiểu 44px và khoảng đệm chân trang pb-36 chống đè thanh điều hướng di động.
            - **Kiến trúc Tiết Kiệm Pin & Zero-Drain (KI-FIX-023)**: Tự động đưa WebView vào trạng thái ngủ khi ẩn ứng dụng (`pauseTimers`/`onPause`), triệt tiêu radio tail state wakelock và vô hiệu hóa vòng lặp render GPU khi màn hình tĩnh.
            - **Bộ Công Cụ So Sánh Ảnh Đa Khung Nhìn ViewSplit**: Khung nhìn chia đôi / chia ba / chia tư, thanh trượt gạt Before/After, Pixel Inspector loupe HUD 9x9 và cơ chế tự động chuyển ô khi dán ảnh.
            - **Scribd Ad & Tracker Blocking**: Tăng tốc độ tải tài liệu, chặn toàn bộ domain theo dõi/quảng cáo của bên thứ ba, trả kết quả cache tức thì `<100ms`.
            - **Tích hợp Tải TikTok & Audio MP3 Siêu Tốc**: Tải video TikTok gốc không watermark, trích xuất âm thanh MP3 và đồng bộ thư mục Studio Drive.
            - **Khởi động siêu tốc (<80ms)**: Shell Native Kotlin siêu nhẹ (~3MB) loại bỏ hoàn toàn Splash Screen chờ đợi của Chromium WebAPK.

            ### Cài đặt:
            Tải tệp **`duydev-studio.apk`** đính kèm bên dưới và cài đặt trên thiết bị Android của bạn.
