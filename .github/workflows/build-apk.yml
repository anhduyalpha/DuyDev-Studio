name: Build Android APK & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" dist/duydev-studio.apk
          ls -lh dist/duydev-studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duydev-studio-apk
          path: dist/duydev-studio.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: DuyDev Studio Native APK ${{ github.ref_name }}
          files: dist/duydev-studio.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DuyDev Studio Native Android Wrapper (${{ github.ref_name }})

            ### Điểm nổi bật phiên bản ${{ github.ref_name }}:
            - **Tối ưu hóa thời lượng Pin đột phá**: Triệt tiêu 5 nguồn hao pin phần cứng (Radio Tail State modem wakelock, GPU shader thrashing, concurrent polling).
            - **Cắt giảm tải GPU & Màn hình**: Tắt hiệu ứng xoay vô tận khi hoàn tất bài tập, cách ly GPU compositing layer cho background, bảo vệ vòng lặp canvas tự ngủ khi tab ẩn.
            - **Tối ưu hóa WebView Lifecycle**: Bổ sung `onStop()`, phát sự kiện `ds:native-app-paused` ngắt kết nối nền, kích hoạt đầy đủ HTTP Disk Cache 304 Not Modified.
            - **Tên miền Đám mây Mới**: Tích hợp trực tiếp highway domain `https://studio.duydev.cloud`.
            - **Khởi động siêu tốc (<80ms)**: Shell Native Kotlin (~3MB) loại bỏ hoàn toàn Splash Screen 2–3s của Chromium WebAPK.
            - **Chia sẻ tức thì (0ms Splash)**: Giao diện `ShareReceiverActivity` trong suốt hiển thị Bottom Sheet trực tiếp trên ứng dụng nguồn.
            - **Cầu nối Native Bridge**: Truyền tải dữ liệu và tệp tin qua RAM với `@JavascriptInterface`.

            ### Cài đặt:
            Tải tệp **`duydev-studio.apk`** đính kèm bên dưới và cài đặt trên thiết bị Android của bạn.
