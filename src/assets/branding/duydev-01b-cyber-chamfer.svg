<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="neonCyan1b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="neonIndigo1b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow1b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#090A10" stroke="rgba(0,242,254,0.25)" stroke-width="1.5" />
  
  <!-- Outer D Path in Glowing Cyber Cyan -->
  <path d="M 32 26 H 60 C 80 26 94 38 94 60 C 94 82 80 94 60 94 H 32 Z" 
        stroke="url(#neonCyan1b)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow1b)" />
  
  <!-- Inner Interlocking D Path in Electric Indigo -->
  <path d="M 46 40 H 60 C 72 40 80 48 80 60 C 80 72 72 80 60 80 H 46 Z" 
        stroke="url(#neonIndigo1b)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Diagonal Electric Accent Chamfer Cuts -->
  <line x1="32" y1="26" x2="46" y2="40" stroke="#00F2FE" stroke-width="4.5" stroke-linecap="round" />
  <line x1="32" y1="94" x2="46" y2="80" stroke="#6366F1" stroke-width="4.5" stroke-linecap="round" />

  <!-- Dual Glowing Core Pips -->
  <circle cx="62" cy="60" r="3.5" fill="#00F2FE" filter="url(#glow1b)" />
</svg>
