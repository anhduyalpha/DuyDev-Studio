<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="fireGrad4a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="50%" stop-color="#FB8500" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
    <filter id="glow4a" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#0E0C0B" stroke="rgba(251,133,0,0.25)" stroke-width="1.5" />
  
  <!-- Swept-forward Delta Wing Frame (Shaped as dynamic forward D) -->
  <path d="M 38 28 L 74 28 C 92 28 104 42 104 60 C 104 78 92 92 74 92 L 38 92 L 52 60 Z" 
        stroke="url(#fireGrad4a)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow4a)" />

  <!-- Inner Supersonic Core Airfoil -->
  <polygon points="56,60 76,46 72,60 76,74" fill="url(#fireGrad4a)" />

  <!-- 3 Aerodynamic Speed Streaks (Trailing velocity lines) -->
  <line x1="14" y1="44" x2="32" y2="44" stroke="#FFB703" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="8" y1="60" x2="30" y2="60" stroke="#FB8500" stroke-width="4" stroke-linecap="round" />
  <line x1="16" y1="76" x2="34" y2="76" stroke="#E63946" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Forward Mach Apex Indicator -->
  <circle cx="104" cy="60" r="2.5" fill="#FFFFFF" />
</svg>
