name: Build Android APK & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" dist/duydev-studio.apk
          ls -lh dist/duydev-studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duydev-studio-apk
          path: dist/duydev-studio.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: DuyDev Studio Native APK ${{ github.ref_name }}
          files: dist/duydev-studio.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DuyDev Studio Native Android Wrapper (${{ github.ref_name }})

            ### Điểm nổi bật phiên bản ${{ github.ref_name }}:
            - **Tích hợp Tải TikTok & Audio MP3 Siêu Tốc**: Tải video TikTok gốc không watermark và trích xuất file âm thanh MP3 nhanh chóng.
            - **Hỗ trợ Chia Sẻ Link TikTok Trực Tiếp (Android Share Sheet)**: Chia sẻ trực tiếp từ ứng dụng TikTok hoặc trình duyệt sang DuyDev Studio để tự động chuyển đến trang tải.
            - **Thư Mục Drive TikTok Chuyên Biệt**: Tự động đồng bộ và quản lý toàn bộ tệp TikTok đã tải ngay trong tab `/tiktok` của DuyDev Studio Drive.
            - **Triệt tiêu đơ giật khi dán liên kết**: Tối ưu cơ chế clipboard non-blocking, ngăn chặn tình trạng treo trình duyệt Chrome / WebView trên thiết bị Android.
            - **Chuẩn hóa Giao diện Tối giản & Typography**: Cải tiến typography theo phong cách Apple, đồng bộ chế độ sáng / tối hoàn hảo và loại bỏ toàn bộ từ ngữ AI rườm rà.
            - **Tối ưu hóa Pin & Bộ Nhớ**: Triệt tiêu hao pin radio wakelock, cách ly GPU compositing layer, bảo vệ vòng lặp render tự ngủ khi ẩn ứng dụng.
            - **Khởi động siêu tốc (<80ms)**: Shell Native Kotlin siêu nhẹ (~3MB) loại bỏ hoàn toàn Splash Screen chờ đợi của Chromium WebAPK.

            ### Cài đặt:
            Tải tệp **`duydev-studio.apk`** đính kèm bên dưới và cài đặt trên thiết bị Android của bạn.
