name: Build Android APK & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" dist/duydev-studio.apk
          ls -lh dist/duydev-studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duydev-studio-apk
          path: dist/duydev-studio.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: DuyDev Studio Native APK ${{ github.ref_name }}
          files: dist/duydev-studio.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DuyDev Studio Native Android Wrapper (${{ github.ref_name }})

            ### Điểm nổi bật phiên bản ${{ github.ref_name }}:
            - **Khởi Động Tức Thì (<16ms) & Native Splash Overlay**: Bổ sung overlay hiển thị ngay lập tức logo app và spinner khi cold boot, tự động fade-out mượt mà ngay khi trang web vẽ frame đầu tiên; loại bỏ triệt để hiện tượng đơ/chậm khi mở app từ màn hình chính.
            - **Khắc Phục Triệt Để Màn Hình Đen Khi Chia Sẻ Tệp & Liên Kết**: Loại bỏ race condition và xung đột SurfaceFlinger khi nhận dữ liệu từ Android Share Sheet; điều hướng tức thì bằng route hash trong 0ms mà không reload trang.
            - **Tối Ưu Hóa Luồng I/O & Ngăn Ngừa Nghẽn Main Thread**: Chuyển việc nạp tệp chia sẻ sang luồng stream trực tiếp (`fetchUrl`) thay vì mã hóa Base64 10MB đồng bộ trên Main Thread gây đơ UI (ANR).
            - **Bảo Vệ Tiến Trình Render (onRenderProcessGone)**: Tự động phục hồi sạch sẽ khi hệ thống Android giải phóng bộ nhớ dưới tải nặng, chống đơ chết giao diện.
            - **Vendor Cục Bộ Lucide Icons & Cache Thông Minh Theo Kết Nối**: Precache bộ icon cục bộ thay vì tải đồng bộ từ CDN, tự động kích hoạt `LOAD_CACHE_ELSE_NETWORK` khi ngoại tuyến hoặc mạng yếu.

            ### Cài đặt:
            Tải tệp **`duydev-studio.apk`** đính kèm bên dưới và cài đặt trên thiết bị Android của bạn. Hoặc vào trang Máy chủ > Cập nhật APK trong ứng dụng để nâng cấp tự động.
