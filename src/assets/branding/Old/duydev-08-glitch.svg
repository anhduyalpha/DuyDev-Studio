<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="glitchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140A10" />
      <stop offset="100%" stop-color="#050305" />
    </linearGradient>
    <filter id="chromaticAberration" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#glitchBg)" stroke="rgba(255,0,85,0.3)" stroke-width="1.5" />
  
  <!-- Outer Cyber Shield Frame -->
  <polygon points="60,18 96,34 96,74 60,102 24,74 24,34" 
           stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none" />

  <!-- Cyan Glitch Ghost Offset (Left -2px) -->
  <path d="M 38 34 H 60 C 76 34 86 44 86 58 C 86 72 76 82 60 82 H 38 V 34 Z M 48 44 V 72 H 58 C 68 72 74 66 74 58 C 74 50 68 44 58 44 H 48 Z" 
        fill="#00F0FF" opacity="0.65" transform="translate(-3, -1)" />

  <!-- Magenta Glitch Ghost Offset (Right +2px) -->
  <path d="M 38 34 H 60 C 76 34 86 44 86 58 C 86 72 76 82 60 82 H 38 V 34 Z M 48 44 V 72 H 58 C 68 72 74 66 74 58 C 74 50 68 44 58 44 H 48 Z" 
        fill="#FF0055" opacity="0.65" transform="translate(3, 1)" />

  <!-- Main Solid Pure White Core D -->
  <path d="M 40 34 H 62 C 78 34 88 44 88 58 C 88 72 78 82 62 82 H 40 V 34 Z M 50 44 V 72 H 60 C 70 72 76 66 76 58 C 76 50 70 44 60 44 H 50 Z" 
        fill="#FFFFFF" />

  <!-- Horizontal Glitch Slice Interlace Lines -->
  <line x1="20" y1="52" x2="100" y2="52" stroke="#050305" stroke-width="3" />
  <line x1="26" y1="52" x2="68" y2="52" stroke="#00F0FF" stroke-width="1.8" />
  <line x1="72" y1="52" x2="94" y2="52" stroke="#FF0055" stroke-width="1.8" />

  <line x1="20" y1="64" x2="100" y2="64" stroke="#050305" stroke-width="3" />
  <line x1="34" y1="64" x2="82" y2="64" stroke="#00F0FF" stroke-width="1.8" />
</svg>
