<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DuyDev Studio - Utility Hub</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#09090B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DuyDev Studio">
  <meta name="description" content="Personal Utility Hub & File Processing Suite">
  
  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="src/assets/logo-ds.svg">
  <link rel="apple-touch-icon" href="src/assets/icon-192.svg">
  
  <!-- Google Fonts: Plus Jakarta Sans (Primary UI), Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              brand: {
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
              }
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(4px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              }
            },
            animation: {
              fadeIn: 'fadeIn 0.2s ease-out forwards',
              shimmer: 'shimmer 1.8s infinite',
            }
          }
        }
      };
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stitch Design Tokens & Custom CSS -->
  <link rel="stylesheet" href="src/styles/stitch-tokens.css?v=12.1">
  <link rel="stylesheet" href="src/styles/studocu.css?v=12.1">
  <link rel="stylesheet" href="src/styles/highlight-theme.css?v=12.1">

  <!-- Autonomous Cache Recovery & Script Error Boundary -->
  <script>
    // 1. Proactive Service Worker check & Stale Cache Eviction
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(function(reg) {
          reg.update().catch(function() {});
        })
        .catch(function() {});
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        names.forEach(function(name) {
          if (name !== 'duydev-studio-v12.1') {
            caches.delete(name);
          }
        });
      });
    }



    // 2. Full deep reset function
    window.emergencyResetApp = async function() {
      try {
        localStorage.clear();
        sessionStorage.clear();
        if ('caches' in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function(k) { return caches.delete(k); }));
        }
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function(r) { return r.unregister(); }));
        }
      } catch (err) {
        console.warn('Reset error:', err);
      }
      window.location.replace(window.location.origin + window.location.pathname + '?clear=' + Date.now());
    };

    // 3. Autonomous Self-Healing Error Boundary
    window.addEventListener('error', function(e) {
      console.error('[Global Error]', e.error || e.message);
      var app = document.getElementById('app');
      if (app && !app.querySelector('main')) {
        // Automatic single retry with cache purge to heal stale bytecode transparently
        if (!sessionStorage.getItem('ds_auto_recovered')) {
          sessionStorage.setItem('ds_auto_recovered', 'true');
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
                window.location.replace(window.location.origin + window.location.pathname + '?heal=' + Date.now());
              });
            });
          } else {
            window.location.replace(window.location.origin + window.location.pathname + '?heal=' + Date.now());
          }
          return;
        }

        // Persistent failure UI
        app.innerHTML = '<div class="min-h-screen flex items-center justify-center p-4 bg-zinc-950 text-white font-mono">' +
          '<div class="max-w-md w-full p-6 rounded-2xl bg-zinc-900 border border-red-500/30 text-center space-y-4 shadow-xl">' +
          '<h2 class="text-red-400 font-bold text-base">Khởi động giao diện thất bại</h2>' +
          '<p class="text-xs text-zinc-400 leading-relaxed break-all">' + (e.message || 'Lỗi khi tải tập lệnh ứng dụng.') + '</p>' +
          '<div class="pt-2 flex justify-center gap-2">' +
          '<button onclick="emergencyResetApp()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold cursor-pointer shadow-md transition">Xóa sạch bộ nhớ đệm & Tải lại</button>' +
          '</div></div></div>';
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[Unhandled Rejection]', e.reason);
      var app = document.getElementById('app');
      if (app && !app.querySelector('main')) {
        var reason = (e.reason && e.reason.message) || String(e.reason) || 'Lỗi tải mô-đun ứng dụng';
        app.innerHTML = '<div class="min-h-screen flex items-center justify-center p-4 bg-zinc-950 text-white font-mono">' +
          '<div class="max-w-md w-full p-6 rounded-2xl bg-zinc-900 border border-red-500/30 text-center space-y-4 shadow-xl">' +
          '<h2 class="text-red-400 font-bold text-base">Khởi động giao diện thất bại</h2>' +
          '<p class="text-xs text-zinc-400 leading-relaxed break-all">' + reason + '</p>' +
          '<div class="pt-2 flex justify-center gap-2">' +
          '<button onclick="emergencyResetApp()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold cursor-pointer shadow-md transition">Xóa sạch bộ nhớ đệm & Tải lại</button>' +
          '</div></div></div>';
      }
    });
  </script>
</head>
<body class="bg-[#F4F4F6] dark:bg-[#09090B] text-zinc-900 dark:text-[#FAFAFA] font-sans min-h-screen transition-colors duration-200">
  
  <!-- Root Mount Point for Modular PWA Architecture -->
  <div id="app">
    <!-- Immediate CSS loader to prevent black void during script execution -->
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="flex flex-col items-center gap-3 text-zinc-400">
        <div class="w-9 h-9 rounded-xl bg-zinc-200 dark:bg-white/[0.08] border border-zinc-300 dark:border-white/[0.12] flex items-center justify-center font-bold text-xs text-zinc-900 dark:text-white animate-pulse">
          DS
        </div>
        <span class="text-xs font-mono text-zinc-500">Đang khởi động DuyDev Studio...</span>
      </div>
    </div>
  </div>

  <!-- Code Syntax Highlighting Engine -->
  <script src="src/vendor/highlight.min.js"></script>

  <!-- Thinking Orbs Canvas 2D Engine -->
  <script src="src/vendor/thinking-orbs.js"></script>

  <!-- QR Code Styling Engine (Local Vendor with CDN Fallback) -->
  <script src="src/vendor/qr-code-styling.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js';"></script>

  <!-- Main ES Module Bootstrapper -->
  <script type="module" src="src/app.js?v=12.1"></script>
</body>
</html>
