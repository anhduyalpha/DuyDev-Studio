<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="termNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <filter id="neonGlowTerm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Shell Background -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#termBg)" stroke="rgba(6,182,212,0.25)" stroke-width="1.5" />
  
  <!-- Terminal Prompt Bracket '>' morphing into D -->
  <path d="M 28 40 L 46 60 L 28 80" 
        stroke="url(#termNeon)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Sweeping Curved D Bow -->
  <path d="M 52 34 H 64 C 82 34 94 45 94 60 C 94 75 82 86 64 86 H 52" 
        stroke="url(#termNeon)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Blinking Underscore Cursor '_' -->
  <line x1="52" y1="86" x2="72" y2="86" stroke="#10B981" stroke-width="7" stroke-linecap="round" filter="url(#neonGlowTerm)" />
  
  <!-- Binary Sub-dot Pulse -->
  <circle cx="94" cy="34" r="3" fill="#00F2FE" filter="url(#neonGlowTerm)" />
</svg>
