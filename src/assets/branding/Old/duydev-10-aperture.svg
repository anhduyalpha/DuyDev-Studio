<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="apertureAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="apertureBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141118" />
      <stop offset="100%" stop-color="#070508" />
    </linearGradient>
    <filter id="glowAperture" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#apertureBg)" stroke="rgba(245,158,11,0.25)" stroke-width="1.5" />
  
  <!-- Outer Calibrated Lens Rim -->
  <circle cx="60" cy="60" r="44" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- 6 Mechanical Aperture Blades spiraling inward -->
  <g stroke="url(#apertureAmber)" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="60" y1="20" x2="88" y2="44" />
    <line x1="95" y1="40" x2="88" y2="76" />
    <line x1="95" y1="80" x2="60" y2="100" />
    <line x1="60" y1="100" x2="32" y2="76" />
    <line x1="25" y1="80" x2="32" y2="44" />
    <line x1="25" y1="40" x2="60" y2="20" />
  </g>

  <!-- Glowing Central Lens Core Shaped as Stylized D -->
  <path d="M 48 42 H 62 C 72 42 78 49 78 60 C 78 71 72 78 62 78 H 48 Z" 
        fill="url(#apertureAmber)" filter="url(#glowAperture)" />
  <path d="M 54 49 H 60 C 65 49 69 53 69 60 C 69 67 65 71 60 71 H 54 Z" 
        fill="#141118" />

  <!-- Lens Flare Specular Highlight Dot -->
  <circle cx="78" cy="42" r="2.5" fill="#FFFFFF" filter="url(#glowAperture)" />
</svg>
