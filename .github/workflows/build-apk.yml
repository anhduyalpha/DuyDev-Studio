name: Build Android APK & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: |
          cd android
          gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" dist/duydev-studio.apk
          ls -lh dist/duydev-studio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duydev-studio-apk
          path: dist/duydev-studio.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: DuyDev Studio Native APK ${{ github.ref_name }}
          files: dist/duydev-studio.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DuyDev Studio Native Android APK (${{ github.ref_name }})

            ### Điểm nổi bật phiên bản ${{ github.ref_name }}:
            - **Tăng Tốc Khởi Động Lạnh (Cold Boot Speedup)**: Tách tải lười (lazy-load) các route/modal phụ khỏi chuỗi khởi động ban đầu của `src/app.js`, `DashboardPage.js` và `Header.js` (giảm đồ thị tải tĩnh từ 103 xuống còn ~29 module), đồng bộ CSS Tailwind tĩnh biên dịch sẵn (bỏ runtime JIT CDN) và áp dụng **Cache-First** cho asset bất biến (`?v=`, `/src/vendor/`, `/src/assets/`) trong Service Worker.
            - **Khởi Chạy WebView Ưu Tiên Trên Android**: `MainActivity` kích hoạt `webView.loadUrl()` sớm ngay sau thiết lập WebView, bỏ qua phân tích Share Intent khi mở app từ màn hình chính và tối ưu chuyển cảnh splash.
            - **Governor Tiết Kiệm Pin & Màn Hình 120Hz**: Dừng animation offscreen trên Dashboard, chuyển Canvas ViewSplit sang render theo nhu cầu (0 rAF idle) và đóng băng WebView thông minh khi chạy nền/khóa máy.
            - **Chia Sẻ Đa Nền Tảng & Lưu Drive Bảo Mật**: Nâng cấp Share Queue chống race condition, hợp nhất QR Style engine, xuất Markdown trực tiếp và lưu tài liệu về Storage Drive có PIN guard.

            ### Cài đặt:
            Tải tệp **`duydev-studio.apk`** đính kèm bên dưới và cài đặt trực tiếp trên thiết bị Android, hoặc vào mục **Máy chủ > Cập nhật APK** ngay trong ứng dụng.
